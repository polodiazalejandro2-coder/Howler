<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify BAMBA</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js" defer></script>
    <script src="scripts.js" defer></script>
</head>

<body>
    <div class="app-container">
        <section class="content-body">
            <h2>Rolas Crackeadas</h2>
            <div id="songs-container" class="songs-grid"></div>
        </section>
        </main>

        <div class="player-controls-center">
            <div class="control-buttons">
                <button id="shuffle-btn"><i class="fa-solid fa-shuffle"></i></button>
                <button id="prev-btn"><i class="fa-solid fa-backward-step"></i></button>
                <button id="play-pause-btn" class="main-play"><i class="fa-solid fa-play"></i></button>
                <button id="next-btn"><i class="fa-solid fa-forward-step"></i></button>
                <button id="repeat-btn"><i class="fa-solid fa-repeat"></i></button>
            </div>

            <div class="progress-container">
                <span id="current-time">0:00</span>
                <input type="range" id="progress-bar" value="0" min="0" max="100">
                <span id="total-duration">0:00</span>
            </div>
        </div>

        <div class="player-extra">
            <i class="fa-solid fa-volume-high"></i>
            <input type="range" id="volume-bar" value="80" min="0" max="100">
        </div>
        </footer>

    </div>

</body>

</html>
